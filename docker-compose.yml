services:
  # Next.js Frontend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yomu-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      CORE_API_BASE_URL: ${CORE_API_BASE_URL:-http://host.docker.internal:8080}
      RUST_ENGINE_URL: ${RUST_ENGINE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: yomu-frontend-network